plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation 'io.javalin:javalin:6.7.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'com.opencsv:opencsv:5.9'
    implementation 'org.slf4j:slf4j-api:2.0.16'
    implementation 'org.apache.logging.log4j:log4j-api:2.24.3'
    runtimeOnly 'org.apache.logging.log4j:log4j-core:2.24.3'
    runtimeOnly 'org.apache.logging.log4j:log4j-slf4j2-impl:2.24.3'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.0'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('invertIndex', JavaExec) {
    group = 'search engine'
    description = 'Generate inverted_index.csv from index.csv'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'searchengine.IndexInverter'
    args file('src/main/resources/index.csv').absolutePath,
            file('src/main/resources/inverted_index.csv').absolutePath
}

def searchKeyword = providers.gradleProperty('keyword').orElse('gate')

tasks.register('search', JavaExec) {
    group = 'search engine'
    description = 'Search the inverted index for a keyword'
    dependsOn tasks.named('invertIndex')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'searchengine.Searcher'
    doFirst {
        args searchKeyword.get(),
                file('src/main/resources/inverted_index.csv').absolutePath
    }
}

def crawlUrl = providers.gradleProperty('url')
def maxThreads = providers.gradleProperty('maxThreads').orElse('5')

tasks.register('simple_crawl', JavaExec) {
    group = 'search engine'
    description = 'Crawl the hypermedia environment and generate index.csv'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'searchengine.SimpleCrawler'

    doFirst {
        if (!crawlUrl.isPresent() || crawlUrl.get().isBlank()) {
            throw new RuntimeException(
                    "Provide a seed URL with -Purl=https://example.com/start")
        }
        args crawlUrl.get()
    }
}

tasks.register('multithreaded_crawl', JavaExec) {
    group = 'search engine'
    description = 'Crawl the hypermedia environment with multiple threads and generate index.csv'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'searchengine.MultithreadedCrawler'

    doFirst {
        if (!crawlUrl.isPresent() || crawlUrl.get().isBlank()) {
            throw new RuntimeException(
                    "Provide a seed URL with -Purl=https://example.com/start")
        }
        args crawlUrl.get(), maxThreads.get()
    }
}

application {
    mainClass = 'searchengine.SearchEngineApplication'
}
